<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="14" height="6" viewBox="0 0 14 6">
  <!-- Active: plain square 2px blue border. -->
  <g fill="#008cff">
    <rect id="decoration-topleft" x="0" y="0" width="2" height="2"/>
    <rect id="decoration-top" x="2" y="0" width="2" height="2"/>
    <rect id="decoration-topright" x="4" y="0" width="2" height="2"/>
    <rect id="decoration-left" x="0" y="2" width="2" height="2"/>
    <rect id="decoration-center" x="2" y="2" width="2" height="2" fill-opacity="0"/>
    <rect id="decoration-right" x="4" y="2" width="2" height="2"/>
    <rect id="decoration-bottomleft" x="0" y="4" width="2" height="2"/>
    <rect id="decoration-bottom" x="2" y="4" width="2" height="2"/>
    <rect id="decoration-bottomright" x="4" y="4" width="2" height="2"/>
  </g>

  <!-- Inactive: the same border in a subdued blue. -->
  <g fill="#244a61">
    <rect id="decoration-inactive-topleft" x="8" y="0" width="2" height="2"/>
    <rect id="decoration-inactive-top" x="10" y="0" width="2" height="2"/>
    <rect id="decoration-inactive-topright" x="12" y="0" width="2" height="2"/>
    <rect id="decoration-inactive-left" x="8" y="2" width="2" height="2"/>
    <rect id="decoration-inactive-center" x="10" y="2" width="2" height="2" fill-opacity="0"/>
    <rect id="decoration-inactive-right" x="12" y="2" width="2" height="2"/>
    <rect id="decoration-inactive-bottomleft" x="8" y="4" width="2" height="2"/>
    <rect id="decoration-inactive-bottom" x="10" y="4" width="2" height="2"/>
    <rect id="decoration-inactive-bottomright" x="12" y="4" width="2" height="2"/>
  </g>
</svg>
